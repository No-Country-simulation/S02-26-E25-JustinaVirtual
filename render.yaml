databases:
  - name: justina-postgresql
    databaseName: justina_db
    user: justina_user
    region: ohio
    plan: free
    ipAllowList: []

services:
  # Backend Python - IA Service
  - type: web
    name: justina-ai-backend
    runtime: python
    region: ohio
    plan: free
    branch: feature/render-deployment
    rootDir: ai_service
    buildCommand: find . -type f -name '*.pyc' -delete && find . -type d -name '__pycache__' -exec rm -rf {} + || true && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: justina-postgresql
          property: connectionString
      - key: RENDER
        value: true
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
    autoDeploy: true

