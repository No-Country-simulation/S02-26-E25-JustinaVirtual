databases:
  - name: justina-postgresql
    databaseName: justina_db
    user: justina_user
    region: ohio
    plan: free
    ipAllowList: []

services:
  # Backend Python - IA Service
  - type: web
    name: justina-ai-backend
    runtime: python
    region: ohio
    plan: free
    branch: feature/render-deployment
    rootDir: ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: justina-postgresql
          property: connectionString
      - key: RENDER
        value: true
    autoDeploy: true

