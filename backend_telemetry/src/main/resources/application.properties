# --- SERVIDOR ---
spring.application.name=JustinaBackend
server.port=8081
server.servlet.context-path=/api

# --- BANCO DE DADOS (PostgreSQL Docker) ---
# Aqui forçamos o uso do Postgres que entende JSONB
spring.datasource.url=jdbc:postgresql://localhost:5432/justina_db
spring.datasource.username=user_justina
spring.datasource.password=password_justina
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE ---
# Define o dialeto correto para criar as tabelas e índices
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- INTEGRAÇÕES ---
app.ai-service.url=http://localhost:5000

# --- CHAVES E SEGURANÇA ---
gemini.api.key=${GEMINI_API_KEY:chave_fake_para_dev_local}
api.security.token.secret=segredo-padrao-desenvolvimento-justina-123
