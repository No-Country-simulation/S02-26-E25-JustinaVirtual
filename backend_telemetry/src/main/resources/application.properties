spring.application.name=JustinaBackend
# Mantemos a porta 8081 para liberar a 8080 para o Docker
server.port=8081

# Integração com Python
app.ai-service.url=http://localhost:5000

# --- BANCO DE DADOS OFICIAL (PostgreSQL via Docker) ---
# Estamos priorizando sua configuração de persistência real
spring.datasource.url=jdbc:postgresql://localhost:5432/justina_db
spring.datasource.username=user_justina
spring.datasource.password=password_justina
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- CONFIGURAÇÕES DA EQUIPE (Incorporadas) ---
# Boa prática para evitar conexões presas na camada de visualização
spring.jpa.open-in-view=false

