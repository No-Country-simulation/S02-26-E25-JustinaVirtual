spring.application.name=JustinaBackend
server.port=${PORT:8081}
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/justina_db}
spring.datasource.username=${DB_USER:user_justina}
spring.datasource.password=${DB_PASSWORD:password_justina}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

app.ai-service.url=${AI_SERVICE_URL:http://ai-service:8000}
